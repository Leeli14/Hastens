name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - new-branch-gpt
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd e_commerce
          flutter pub get

      - name: Build Flutter web
        run: |
          cd e_commerce
          flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Verify build output
        run: |
          ls -la e_commerce/build/web/
          echo "Build files count: $(find e_commerce/build/web -type f | wc -l)"

      - name: Setup SPA routing for GitHub Pages
        run: |
          cd e_commerce/build/web
          cp index.html 404.html
          echo "" > .nojekyll

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/new-branch-gpt'
        run: |
          # Create gh-pages branch if it doesn't exist
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Check if gh-pages exists
          if git ls-remote --exit-code --heads origin gh-pages; then
            echo "gh-pages branch exists, checking it out"
            git checkout gh-pages
          else
            echo "Creating gh-pages branch"
            git checkout --orphan gh-pages
            git reset --hard
          fi
          
          # Remove all files
          git rm -rf . --ignore-unmatch
          
          # Copy build files
          cp -r e_commerce/build/web/* .
          
          # Add and commit
          git add .
          git commit -m "Deploy to GitHub Pages"
          
          # Push
          git push origin gh-pages
          cname: # Optional: uncomment and add custom domain if you have one
