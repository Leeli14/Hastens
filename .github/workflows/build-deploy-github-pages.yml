name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - new-branch-gpt
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'latest'
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd e_commerce
          flutter pub get

      - name: Build Flutter web
        run: |
          cd e_commerce
          flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/new-branch-gpt'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./e_commerce/build/web
          cname: # Optional: uncomment and add custom domain if you have one
